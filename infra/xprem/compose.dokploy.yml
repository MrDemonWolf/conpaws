name: mrdemonwolf-xprem

services:
  xprem:
    # Keep rebuilds on reviewed release bytes even if the upstream tag moves.
    image: ghcr.io/mercuretechnologies/xprem:v3.2.7@sha256:fd6998921c343f6151867195cc6373415d4c134b106a97ccebe9e885f848bc26
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_URL: ${BASE_URL:?Set BASE_URL in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      DB_URL: ${DB_URL:?Set DB_URL in Dokploy}
      DB_KEYS_MASTER_KEY_B64: ${DB_KEYS_MASTER_KEY_B64:?Set DB_KEYS_MASTER_KEY_B64 in Dokploy}
      STORAGE_MODE: s3
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_BASE_ENDPOINT: ${AWS_BASE_ENDPOINT:?Set AWS_BASE_ENDPOINT in Dokploy}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in Dokploy}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in Dokploy}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in Dokploy}
      # Process-local cache is safe for one replica; switch to shared Redis before scaling out.
      CACHE_MODE: local
      USE_DASHBOARD: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Keep usage and device data out of XPRem until collection is explicitly approved.
      DISABLE_TELEMETRY: "true"
      DISABLE_DEVICE_TELEMETRY: "true"
      PROMETHEUS_ENABLED: "false"
      # Forwarded client IPs affect auth and rate limits; depth must match the verified tunnel chain.
      TRUST_PROXY_HEADERS: "true"
      TRUST_PROXY_DEPTH: ${TRUST_PROXY_DEPTH:?Set TRUST_PROXY_DEPTH to the verified proxy hop count}
    # The tunnel and database join this private network; no host port is published.
    networks:
      - dokploy-network
    # XPRem only needs ephemeral writes, so keep the container filesystem immutable.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    # The app needs no extra Linux capabilities or privilege escalation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # This gates process readiness; staging must still verify real R2 downloads.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "5"
        - -O
        - /dev/null
        - http://127.0.0.1:3000/ready
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  dokploy-network:
    external: true
