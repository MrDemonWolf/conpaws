version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # `bun`, not `npm`. This repo installs with bun and CI runs
  # `bun install --frozen-lockfile`, so an updater that edits package.json
  # without touching bun.lock produces a PR that cannot pass: it fails at
  # install with "lockfile had changes, but lockfile is frozen". The npm
  # ecosystem does exactly that. Dependabot's bun ecosystem understands the
  # text-based bun.lock (Bun >=1.1.39; this repo pins 1.3.10).
  #
  # Nothing watched Next, wrangler, @opennextjs/cloudflare, drizzle, zod or
  # the Expo stack for advisories before this. Grouped and monthly on purpose:
  # a small monorepo with several deliberate exact pins, where a weekly flood
  # of individual PRs would be ignored, which is worse than not having them.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned exactly, with the reason recorded in CLAUDE.md and the Notion
      # Prerelease Site page. Next 16.3 + OpenNext has an unbounded prefetch
      # loop (opennextjs-cloudflare#1334), and these two move together.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opennextjs/cloudflare"
        update-types: ["version-update:semver-major"]
      # The Expo SDK is upgraded as a set, via `expo install`, never one
      # package at a time -- a lone bump here produces a build that fails
      # `expo-doctor` and wastes a review.
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: react-native
