name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the version in package.json `packageManager`. The runner default
      # can differ, and installs below use --frozen-lockfile, which fails on a
      # mismatch with "lockfile had changes, but lockfile is frozen".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No `working-directory` on any of these: running from the repo root lets
      # Turbo fan out across every workspace. An earlier version of this file
      # pinned all three steps to `apps/mobile`, which does not exist (the app
      # is `apps/native`) — a missing working directory fails the step outright,
      # so this job was red on every push.
      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

  preview:
    name: Preview deploy
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Secrets are unavailable to job-level `if:`, so gate on a step output.
      # Without this the job fails red on every PR until the Cloudflare secrets
      # are added, which reads as "the build is broken" rather than
      # "deployment isn't configured yet".
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview skipped::CLOUDFLARE_API_TOKEN is not set. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository secrets to enable preview deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.configured == 'true'
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Build (OpenNext)
        if: steps.creds.outputs.configured == 'true'
        run: bunx opennextjs-cloudflare build
        working-directory: apps/web

      # `upload` publishes a new Worker version WITHOUT routing traffic to it,
      # so a PR gets a shareable preview URL and production is untouched.
      # `--keep-vars` is mandatory: without it the deploy wipes runtime secrets
      # (BREVO_API_KEY, Turnstile) that live in Cloudflare, not GitHub.
      - name: Upload preview version
        if: steps.creds.outputs.configured == 'true'
        run: bunx opennextjs-cloudflare upload -- --keep-vars
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set. Add CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit) and CLOUDFLARE_ACCOUNT_ID to repository secrets to enable deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.configured == 'true'
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      # Migrations run BEFORE the deploy so the schema is never behind the code
      # that queries it. Skipped until the d1_databases binding is uncommented
      # in wrangler.jsonc (CON-25) — `wrangler d1 migrations apply` errors out
      # with no binding, and that would block deploying the rest of the site.
      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        run: |
          if grep -q '"d1_databases"' wrangler.jsonc; then
            bunx wrangler d1 migrations apply conpaws-db --remote
          else
            echo "::notice title=No D1 binding::wrangler.jsonc has no d1_databases block yet — skipping migrations (CON-25)."
          fi
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build (OpenNext)
        if: steps.creds.outputs.configured == 'true'
        run: bunx opennextjs-cloudflare build
        working-directory: apps/web

      # Deliberately NOT cloudflare/wrangler-action: it wraps `wrangler deploy`,
      # but OpenNext has to drive its own deploy (it also populates the remote
      # incremental cache). A plain run step with the two env vars is simpler —
      # the adapter shells out to wrangler, which reads them.
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        run: bunx opennextjs-cloudflare deploy -- --keep-vars
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
