name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Static analysis and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test dependency audit gate
        run: bun run security:audit:test

      - name: Audit dependencies
        run: bun run security:audit

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Set up release tooling
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Check store release guards without credentials
        working-directory: apps/native
        run: bundle exec ruby fastlane/check.rb

      - name: Test native under Pacific/Auckland
        env:
          TZ: Pacific/Auckland
        run: bun run --filter @conpaws/native test

      # A schema edit without a regenerated migration passes lint, types, tests
      # and the Worker smoke test, and only surfaces at deploy -- where
      # alchemy.run.ts warns that D1 drift is not recoverable by rolling the
      # Worker back. Regenerating and checking the tree is clean is what turns
      # that into a failed PR instead.
      - name: Check D1 migrations match the schema
        working-directory: apps/web
        run: |
          bun run db:generate
          if [[ -n "$(git status --porcelain drizzle/migrations)" ]]; then
            git status --short drizzle/migrations
            echo "::error title=Migration drift::src/db/schema.ts changed without a matching migration. Run 'bun run db:generate' in apps/web and commit the result."
            exit 1
          fi

      # No admin drift check: apps/admin/drizzle/migrations are hand-written
      # SQL without drizzle-kit snapshot metadata, so `db:generate` always
      # emits a full baseline there. Admin migrations are reviewed by hand.

  web:
    name: Build and smoke-test Cloudflare Workers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext Worker
        run: bun run build:cloudflare
        working-directory: apps/web

      - name: Build admin OpenNext Worker
        run: bun run --filter @conpaws/admin build:cloudflare

      - name: Smoke-test built Worker
        working-directory: apps/web
        run: |
          preview_log="${RUNNER_TEMP}/open-next-preview.log"
          preview_pid=""

          cleanup() {
            if [[ -n "$preview_pid" ]]; then
              kill "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          bunx opennextjs-cloudflare preview -- --port 8787 >"$preview_log" 2>&1 &
          preview_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$preview_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$preview_log"
            echo "::error title=Worker smoke test failed::Local Worker did not become ready."
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:8787/privacy >/dev/null

          curl --silent --show-error --fail http://127.0.0.1:8787/api/health |
            jq --exit-status --arg release "$GITHUB_SHA" \
              '.ok == true and .release == $release' >/dev/null

          http_status="$(
            curl --silent --show-error \
              --output "${RUNNER_TEMP}/waitlist-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "content-type: application/json" \
              --data '{"email":"ci@example.com","name":"CI","elapsedMs":3000}' \
              http://127.0.0.1:8787/api/waitlist
          )"
          # The local preview Worker has no listmonk or Turnstile secrets bound, so
          # a valid submission must fail closed rather than claim success. When
          # the waitlist opens, this assertion does NOT change: the check proves
          # the unconfigured path, not the production path. It would only change
          # if the preview run were given real secrets.
          if [[ "$http_status" != "503" ]]; then
            cat "${RUNNER_TEMP}/waitlist-response.json"
            echo "::error title=Waitlist fail-closed check failed::Expected HTTP 503, received $http_status."
            exit 1
          fi

          # The code-generated SEO surfaces. These are built by robots.ts,
          # sitemap.ts and llms.txt/route.ts, all of which can throw at request
          # time -- a bad date, a broken hreflang map -- while lint, types and
          # the unit tests stay perfectly green. Fetching them is the only
          # thing that proves they render at all.
          for path in /robots.txt /sitemap.xml /llms.txt; do
            curl --silent --show-error --fail "http://127.0.0.1:8787${path}" >/dev/null
          done

          # The preview has no listmonk binding, so the badge count must answer
          # null rather than 0. Zero is a claim that nobody has signed up, and
          # an outage must never be able to make it.
          curl --silent --show-error --fail http://127.0.0.1:8787/api/waitlist/count |
            jq --exit-status '.count == null' >/dev/null

          bun scripts/e2e.ts http://127.0.0.1:8787

          # Rendered check: no locale page may scroll sideways at 320 or 375px
          # (e2e.ts only sees HTML; a long Norwegian hero word slipped past it).
          bunx playwright-core install --with-deps chromium-headless-shell
          bun scripts/overflow.ts http://127.0.0.1:8787

      - name: Smoke-test admin Worker
        working-directory: apps/admin
        run: |
          cp .dev.vars.example .dev.vars
          bun run db:migrate:local
          bun run db:seed:local

          admin_log="${RUNNER_TEMP}/admin-preview.log"
          admin_pid=""

          cleanup() {
            if [[ -n "$admin_pid" ]]; then
              kill "$admin_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          bunx opennextjs-cloudflare preview --ip 127.0.0.1 --port 8788 --persist-to .wrangler/state >"$admin_log" 2>&1 &
          admin_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8788/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$admin_pid" 2>/dev/null; then
              cat "$admin_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$admin_log"
            echo "::error title=Admin smoke test failed::Local admin Worker did not become ready."
            exit 1
          fi

          bun run test:e2e -- http://127.0.0.1:8788

      # The API Worker is plain Hono on workerd, so wrangler dev is the real
      # runtime. Without a migrated catalog the list route must fail closed as
      # a 503 JSON body, and the old /api prefix the website used to serve
      # must be gone: the native app only ever talks to /v1 on api.conpaws.com.
      - name: Smoke-test API Worker
        working-directory: apps/api
        run: |
          api_log="${RUNNER_TEMP}/api-dev.log"
          api_pid=""

          cleanup() {
            if [[ -n "$api_pid" ]]; then
              kill "$api_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          bunx wrangler dev --ip 127.0.0.1 --port 8790 --persist-to "${RUNNER_TEMP}/api-state" >"$api_log" 2>&1 &
          api_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8790/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$api_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$api_log"
            echo "::error title=API smoke test failed::Local API Worker did not become ready."
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:8790/health |
            jq --exit-status '.status == "ok"' >/dev/null

          list_status="$(
            curl --silent --show-error \
              --output "${RUNNER_TEMP}/api-list.json" \
              --write-out "%{http_code}" \
              http://127.0.0.1:8790/v1/conventions
          )"
          if [[ "$list_status" != "503" ]] ||
            ! jq --exit-status '.error == "catalog_unavailable"' "${RUNNER_TEMP}/api-list.json" >/dev/null; then
            cat "${RUNNER_TEMP}/api-list.json"
            echo "::error title=API fail-closed check failed::Expected a 503 catalog_unavailable body without a catalog, received $list_status."
            exit 1
          fi

          old_prefix_status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              http://127.0.0.1:8790/api/v1/conventions
          )"
          if [[ "$old_prefix_status" != "404" ]]; then
            echo "::error title=API prefix check failed::/api/v1 must not exist on the API Worker, received $old_prefix_status."
            exit 1
          fi

  infrastructure:
    name: Validate deployment descriptors
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate hardened xprem Compose
        env:
          TRUST_PROXY_DEPTH: "1"
        run: |
          compose_json="${RUNNER_TEMP}/xprem-compose.json"
          docker compose \
            --env-file infra/xprem/.env.example \
            --file infra/xprem/compose.dokploy.yml \
            config --format json > "$compose_json"

          jq --exit-status '
            ((.services | keys) == ["xprem"]) and
            (.services.xprem.image == "ghcr.io/mercuretechnologies/xprem:v3.2.6@sha256:e63c81b1212d553fe84a69121543eb5e376c33103bd10902bb7970519dc7e2f8") and
            (.services.xprem.read_only == true) and
            (.services.xprem.cap_drop | index("ALL") != null) and
            (.services.xprem.security_opt | index("no-new-privileges:true") != null) and
            (((.services.xprem.ports // []) | length) == 0) and
            (((.services.xprem.volumes // []) | length) == 0) and
            (.services.xprem.environment.CACHE_MODE == "local") and
            (.services.xprem.environment.DISABLE_TELEMETRY == "true") and
            (.services.xprem.environment.DISABLE_DEVICE_TELEMETRY == "true") and
            (.services.xprem.environment.PROMETHEUS_ENABLED == "false") and
            (.services.xprem.environment.TRUST_PROXY_HEADERS == "true") and
            (.services.xprem.environment.TRUST_PROXY_DEPTH == "1") and
            (.services.xprem.healthcheck.test | index("http://127.0.0.1:3000/ready") != null)
          ' "$compose_json" >/dev/null
  native:
    name: Validate native config, bundles and Android compile
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated native license manifest
        run: bun run licenses:check
        working-directory: apps/native

      - name: Check Expo package compatibility
        run: bunx expo install --check
        working-directory: apps/native

      - name: Run Expo Doctor
        run: bunx --no-install expo-doctor .
        working-directory: apps/native

      - name: Validate native config plugins
        run: bunx expo prebuild --clean --no-install
        working-directory: apps/native
        env:
          EXPO_NO_GIT_STATUS: "1"

      - name: Check generated native build numbers
        run: bun run build-number:check
        working-directory: apps/native

      - name: Compile Android arm64 debug app
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain
        working-directory: apps/native/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Export iOS production bundle
        run: bunx expo export --platform ios --output-dir "${RUNNER_TEMP}/conpaws-native-ios"
        working-directory: apps/native

      - name: Export Android production bundle
        run: bunx expo export --platform android --output-dir "${RUNNER_TEMP}/conpaws-native-android"
        working-directory: apps/native

  swift:
    name: Test native Swift package
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the same SDK 58 toolchain selected by the store release lane.
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version

      - name: Test widget and Watch logic
        run: swift test --package-path apps/native/swift-tests

  verify:
    name: CI / Verify
    if: always()
    needs: [quality, web, infrastructure, native, swift]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SWIFT_RESULT: ${{ needs.swift.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$WEB_RESULT" != "success" || "$INFRASTRUCTURE_RESULT" != "success" || "$NATIVE_RESULT" != "success" || "$SWIFT_RESULT" != "success" ]]; then
            echo "::error title=CI failed::quality=$QUALITY_RESULT web=$WEB_RESULT infrastructure=$INFRASTRUCTURE_RESULT native=$NATIVE_RESULT swift=$SWIFT_RESULT"
            exit 1
          fi
