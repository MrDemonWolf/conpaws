name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Static analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

  web:
    name: Build and smoke-test Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext Worker
        run: bunx opennextjs-cloudflare build
        working-directory: apps/web

      - name: Smoke-test built Worker
        working-directory: apps/web
        run: |
          preview_log="${RUNNER_TEMP}/open-next-preview.log"
          preview_pid=""

          cleanup() {
            if [[ -n "$preview_pid" ]]; then
              kill "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          bunx opennextjs-cloudflare preview -- --port 8787 >"$preview_log" 2>&1 &
          preview_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$preview_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$preview_log"
            echo "::error title=Worker smoke test failed::Local Worker did not become ready."
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:8787/privacy >/dev/null

          curl --silent --show-error --fail http://127.0.0.1:8787/api/health |
            jq --exit-status --arg release "$GITHUB_SHA" \
              '.ok == true and .release == $release' >/dev/null

          http_status="$(
            curl --silent --show-error \
              --output "${RUNNER_TEMP}/waitlist-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "content-type: application/json" \
              --data '{"email":"ci@example.com","name":"CI","elapsedMs":3000}' \
              http://127.0.0.1:8787/api/waitlist
          )"
          if [[ "$http_status" != "503" ]]; then
            cat "${RUNNER_TEMP}/waitlist-response.json"
            echo "::error title=Waitlist fail-closed check failed::Expected HTTP 503, received $http_status."
            exit 1
          fi

      - name: Package verified Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          artifact_dir="${RUNNER_TEMP}/conpaws-web-artifact"
          mkdir -p "$artifact_dir"
          printf '%s\n' "$GITHUB_SHA" > "$artifact_dir/commit-sha"
          tar -C apps/web -czf "$artifact_dir/conpaws-web.tgz" .open-next
          (
            cd "$artifact_dir"
            sha256sum conpaws-web.tgz > conpaws-web.tgz.sha256
          )

      - name: Upload verified Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conpaws-web-${{ github.sha }}
          path: ${{ runner.temp }}/conpaws-web-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    name: Validate production native bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_VARIANT: production
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Expo package compatibility
        run: bunx expo install --check
        working-directory: apps/native

      - name: Run Expo Doctor
        run: bunx --no-install expo-doctor .
        working-directory: apps/native

      - name: Validate native config plugins
        run: bunx expo prebuild --clean --no-install
        working-directory: apps/native
        env:
          EXPO_NO_GIT_STATUS: "1"

      - name: Export iOS production bundle
        run: bunx expo export --platform ios --output-dir "${RUNNER_TEMP}/conpaws-native-ios"
        working-directory: apps/native

      - name: Export Android production bundle
        run: bunx expo export --platform android --output-dir "${RUNNER_TEMP}/conpaws-native-android"
        working-directory: apps/native

  verify:
    name: CI / Verify
    if: always()
    needs: [quality, web, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$WEB_RESULT" != "success" || "$NATIVE_RESULT" != "success" ]]; then
            echo "::error title=CI failed::quality=$QUALITY_RESULT web=$WEB_RESULT native=$NATIVE_RESULT"
            exit 1
          fi
