name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Static analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test

      # A schema edit without a regenerated migration passes lint, types, tests
      # and the Worker smoke test, and only surfaces at deploy -- where
      # alchemy.run.ts warns that D1 drift is not recoverable by rolling the
      # Worker back. Regenerating and checking the tree is clean is what turns
      # that into a failed PR instead.
      - name: Check D1 migrations match the schema
        working-directory: apps/web
        run: |
          bun run db:generate
          if [[ -n "$(git status --porcelain drizzle/migrations)" ]]; then
            git status --short drizzle/migrations
            echo "::error title=Migration drift::src/db/schema.ts changed without a matching migration. Run 'bun run db:generate' in apps/web and commit the result."
            exit 1
          fi

  web:
    name: Build and smoke-test Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build OpenNext Worker
        run: bunx opennextjs-cloudflare build
        working-directory: apps/web

      - name: Smoke-test built Worker
        working-directory: apps/web
        run: |
          preview_log="${RUNNER_TEMP}/open-next-preview.log"
          preview_pid=""

          cleanup() {
            if [[ -n "$preview_pid" ]]; then
              kill "$preview_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          bunx opennextjs-cloudflare preview -- --port 8787 >"$preview_log" 2>&1 &
          preview_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$preview_log"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            cat "$preview_log"
            echo "::error title=Worker smoke test failed::Local Worker did not become ready."
            exit 1
          fi

          curl --silent --show-error --fail http://127.0.0.1:8787/privacy >/dev/null

          curl --silent --show-error --fail http://127.0.0.1:8787/api/health |
            jq --exit-status --arg release "$GITHUB_SHA" \
              '.ok == true and .release == $release' >/dev/null

          http_status="$(
            curl --silent --show-error \
              --output "${RUNNER_TEMP}/waitlist-response.json" \
              --write-out "%{http_code}" \
              --request POST \
              --header "content-type: application/json" \
              --data '{"email":"ci@example.com","name":"CI","elapsedMs":3000}' \
              http://127.0.0.1:8787/api/waitlist
          )"
          # The local preview Worker has no listmonk or Turnstile secrets bound, so
          # a valid submission must fail closed rather than claim success. When
          # the waitlist opens, this assertion does NOT change: the check proves
          # the unconfigured path, not the production path. It would only change
          # if the preview run were given real secrets.
          if [[ "$http_status" != "503" ]]; then
            cat "${RUNNER_TEMP}/waitlist-response.json"
            echo "::error title=Waitlist fail-closed check failed::Expected HTTP 503, received $http_status."
            exit 1
          fi

          # The code-generated SEO surfaces. These are built by robots.ts,
          # sitemap.ts and llms.txt/route.ts, all of which can throw at request
          # time -- a bad date, a broken hreflang map -- while lint, types and
          # the unit tests stay perfectly green. Fetching them is the only
          # thing that proves they render at all.
          for path in /robots.txt /sitemap.xml /llms.txt; do
            curl --silent --show-error --fail "http://127.0.0.1:8787${path}" >/dev/null
          done

          # The preview has no listmonk binding, so the badge count must answer
          # null rather than 0. Zero is a claim that nobody has signed up, and
          # an outage must never be able to make it.
          curl --silent --show-error --fail http://127.0.0.1:8787/api/waitlist/count |
            jq --exit-status '.count == null' >/dev/null


  infrastructure:
    name: Validate deployment descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate hardened xprem Compose
        env:
          TRUST_PROXY_DEPTH: "1"
        run: |
          compose_json="${RUNNER_TEMP}/xprem-compose.json"
          docker compose \
            --env-file infra/xprem/.env.example \
            --file infra/xprem/compose.dokploy.yml \
            config --format json > "$compose_json"

          jq --exit-status '
            (.services.xprem.image == "ghcr.io/mercuretechnologies/xprem:v3.1.1@sha256:dcfa04bf2acaec20461c5af17419e3b184f4a53b86930ab7b0f75aa23f4b02c4") and
            (.services.redis.image == "redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2") and
            (.services.xprem.read_only == true) and
            (.services.redis.read_only == true) and
            (.services.redis.user == "999:1000") and
            (.services.xprem.cap_drop | index("ALL") != null) and
            (.services.redis.cap_drop | index("ALL") != null) and
            (.services.xprem.security_opt | index("no-new-privileges:true") != null) and
            (.services.redis.security_opt | index("no-new-privileges:true") != null) and
            (((.services.xprem.ports // []) | length) == 0) and
            (((.services.redis.ports // []) | length) == 0) and
            (((.services.redis.volumes // []) | length) == 0) and
            (.services.xprem.environment.DISABLE_DEVICE_TELEMETRY == "true") and
            (.services.xprem.environment.PROMETHEUS_ENABLED == "false") and
            (.services.xprem.environment.TRUST_PROXY_HEADERS == "true") and
            (.services.xprem.environment.TRUST_PROXY_DEPTH == "1") and
            (.services.xprem.healthcheck.test | index("http://127.0.0.1:3000/ready") != null)
          ' "$compose_json" >/dev/null
  native:
    name: Validate production native bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_VARIANT: production
      CI: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Expo package compatibility
        run: bunx expo install --check
        working-directory: apps/native

      - name: Run Expo Doctor
        run: bunx --no-install expo-doctor .
        working-directory: apps/native

      - name: Validate native config plugins
        run: bunx expo prebuild --clean --no-install
        working-directory: apps/native
        env:
          EXPO_NO_GIT_STATUS: "1"

      - name: Export iOS production bundle
        run: bunx expo export --platform ios --output-dir "${RUNNER_TEMP}/conpaws-native-ios"
        working-directory: apps/native

      - name: Export Android production bundle
        run: bunx expo export --platform android --output-dir "${RUNNER_TEMP}/conpaws-native-android"
        working-directory: apps/native

  verify:
    name: CI / Verify
    if: always()
    needs: [quality, web, infrastructure, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$WEB_RESULT" != "success" || "$INFRASTRUCTURE_RESULT" != "success" || "$NATIVE_RESULT" != "success" ]]; then
            echo "::error title=CI failed::quality=$QUALITY_RESULT web=$WEB_RESULT infrastructure=$INFRASTRUCTURE_RESULT native=$NATIVE_RESULT"
            exit 1
          fi
