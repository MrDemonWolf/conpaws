name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin to the version in package.json `packageManager`. The runner default
      # can differ, and installs below use --frozen-lockfile, which fails on a
      # mismatch with "lockfile had changes, but lockfile is frozen".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No `working-directory` on any of these: running from the repo root lets
      # Turbo fan out across every workspace. The previous version of this file
      # pinned all three steps to `apps/mobile`, which does not exist (the app
      # is `apps/native`) — a missing working directory fails the step outright,
      # so this job was red on every push.
      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check-types

      - name: Test
        run: bun run test
