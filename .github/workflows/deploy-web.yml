name: Deploy web

# Production deploy for conpaws.com.
#
# The apply step is Alchemy (packages/infra/alchemy.run.ts). It provisions the
# waitlist and catalog D1 databases and the cdn.conpaws.com R2 bucket, binds
# the listmonk and Turnstile secrets, applies migrations, and uploads the site,
# API (api.conpaws.com) and reconciler Workers in one operation. Once the
# ADMIN_OWNER_EMAIL secret is set it also creates the Cloudflare Access app and
# deploys the admin console at admin.conpaws.com behind it.
#
# Alchemy applies the whole stack in one step; deploys have no canary or
# automatic rollback. Roll back by dispatching this workflow with the last good
# main ancestor SHA, or use `wrangler rollback` from apps/web.
#
# Because of that, keep PRODUCTION_ROUTES_ENABLED false for the first deploy so
# Cloudflare holds a known-good version before conpaws.com points at anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to redeploy for rollback (must be on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stack
    if: >-
      (github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )) &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
      ROUTES_ENABLED: ${{ vars.PRODUCTION_ROUTES_ENABLED }}
      WORKERS_DEV_ENABLED: ${{ vars.WORKERS_DEV_ENABLED }}
      PREVIEW_URLS_ENABLED: ${{ vars.PREVIEW_URLS_ENABLED }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reject stale release
        id: stale
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
              echo "::error title=Invalid rollback SHA::$RELEASE_SHA is not an ancestor of origin/main."
              exit 1
            fi
          elif [[ "$(git rev-parse origin/main)" != "$RELEASE_SHA" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Superseded deploy skipped::A newer main commit exists."
          fi

      - name: Set up Node
        if: steps.stale.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        if: steps.stale.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        if: steps.stale.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Deploy stack
        if: steps.stale.outputs.skip != 'true'
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          WAITLIST_ACCEPTING_SIGNUPS: ${{ vars.WAITLIST_ACCEPTING_SIGNUPS }}
          NEXT_PUBLIC_WAITLIST_ACCEPTING_SIGNUPS: ${{ vars.WAITLIST_ACCEPTING_SIGNUPS }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Build-time and client-side. Without it the env schema falls back to
          # localhost, which makes robots.txt ask crawlers to stay away -- the
          # preview behaviour, served from production.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_MODE: ${{ vars.NEXT_PUBLIC_SITE_MODE }}
          NEXT_PUBLIC_COUNTDOWN_AT: ${{ vars.NEXT_PUBLIC_COUNTDOWN_AT }}
          NEXT_PUBLIC_APP_STORE_URL: ${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
          NEXT_PUBLIC_GOOGLE_PLAY_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_PLAY_URL }}
          NEXT_PUBLIC_MAINTENANCE_MESSAGE: ${{ vars.NEXT_PUBLIC_MAINTENANCE_MESSAGE }}
          LISTMONK_BASE_URL: ${{ vars.LISTMONK_BASE_URL }}
          LISTMONK_API_USER: ${{ vars.LISTMONK_API_USER }}
          LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
          LISTMONK_LIST_ID: ${{ vars.LISTMONK_LIST_ID }}
          # Optional. Set it to deploy the Access-protected admin console.
          ADMIN_OWNER_EMAIL: ${{ secrets.ADMIN_OWNER_EMAIL }}
        # Runs the Alchemy program directly under Node via tsx, matching every
        # other MrDemonWolf Alchemy project. Not `bun`: Bun segfaults executing
        # an Alchemy program. Not the `alchemy` CLI: the program owns its own
        # phase and shared state store.
        run: bun run deploy

      # This step used to be gated on PRODUCTION_ROUTES_ENABLED, which meant that
      # while routes were off — the entire pre-cutover period — nothing checked a
      # deployed Worker at all. Three deploys that threw
      # `ReferenceError: require is not defined` on the edge passed CI green,
      # because CI's smoke test runs `wrangler dev`, where `node:` resolution is
      # more permissive than production. Always probe something real: the custom
      # domain once it is attached, the workers.dev URL before that.
      #
      # The workers.dev branch is only probe-able because WORKERS_DEV_ENABLED is
      # a repository variable set to true — alchemy.run.ts passes it straight to
      # `url:`, so with the variable unset Alchemy asks Cloudflare not to serve
      # that subdomain and this step would retry twenty times against nothing.
      # The two settings are a pair: at cutover, PRODUCTION_ROUTES_ENABLED goes
      # true and WORKERS_DEV_ENABLED goes false, in that order, never both false.
      # This step REPORTS; it does not gate. It cannot roll back — that was
      # always manual — so failing the run only ever cost time deciding whether
      # a red X meant a broken deploy. It did not, twice, and the second time
      # the noise hid a real outage.
      #
      # What actually made it red: Cloudflare Bot Fight Mode issued a Managed
      # Challenge to the GitHub Actions runner (Azure IPs), curl cannot solve a
      # challenge, so every attempt 403'd for the full seven minutes.
      #
      # Bot Fight Mode is ON again as of 2026-08-28 (verified: the zone's
      # bot_management API reports fight_mode true), so this step may well go
      # yellow. It reports rather than gates, so the deploy is unaffected — but
      # the earlier reason for turning it off still stands, namely that it also
      # challenges Googlebot. Note it CANNOT be fixed with a WAF skip rule:
      # Bot Fight Mode runs outside the Ruleset Engine, so Skip/Bypass/Allow do
      # nothing to it. The only per-source exemption on a Free plan is an IP
      # Access rule, which is how Amazon SNS reaches the listmonk bounce webhook
      # on lists.mrdemonwolf.com.
      - name: Report live release
        if: steps.stale.outputs.skip != 'true'
        continue-on-error: true
        env:
          HEALTH_ORIGIN: >-
            ${{ vars.PRODUCTION_ROUTES_ENABLED == 'true'
            && 'https://conpaws.com'
            || 'https://conpaws.mrdemonwolf.workers.dev' }}
        run: |
          # A short retry, because a fresh deploy takes a few seconds to
          # propagate and a single probe would warn on nearly every run. Thirty
          # seconds, not seven minutes: nothing downstream waits on the answer.
          live=""
          for _ in {1..6}; do
            response="$(curl --silent --show-error --max-time 10 "$HEALTH_ORIGIN/api/health" || true)"
            live="$(jq -r '.release // empty' <<< "$response" 2>/dev/null || true)"
            [[ "$live" == "$RELEASE_SHA" ]] && break
            sleep 5
          done

          if [[ "$live" == "$RELEASE_SHA" ]]; then
            echo "::notice title=Live release::$HEALTH_ORIGIN is serving $RELEASE_SHA"
          else
            echo "::warning title=Live release unconfirmed::$HEALTH_ORIGIN reported '${live:-no response}', expected $RELEASE_SHA. The deploy itself succeeded; check $HEALTH_ORIGIN/api/health and the footer hash."
          fi

      # Same shape as the site probe above, for the API Worker: report-only.
      # A brand-new custom domain can take a minute to issue its certificate,
      # so the very first deploy may warn here once.
      - name: Report API health
        if: steps.stale.outputs.skip != 'true'
        continue-on-error: true
        env:
          API_ORIGIN: https://api.conpaws.com
        run: |
          status=""
          for _ in {1..6}; do
            status="$(curl --silent --max-time 10 "$API_ORIGIN/health" | jq -r '.status // empty' 2>/dev/null || true)"
            [[ "$status" == "ok" ]] && break
            sleep 5
          done
          if [[ "$status" == "ok" ]]; then
            echo "::notice title=API live::$API_ORIGIN/health answered ok"
          else
            echo "::warning title=API unconfirmed::$API_ORIGIN/health reported '${status:-no response}'. The deploy itself succeeded; check the conpaws-api Worker and its custom domain."
          fi

      - name: Compare live security headers
        if: steps.stale.outputs.skip != 'true'
        continue-on-error: true
        env:
          HEALTH_ORIGIN: >-
            ${{ vars.PRODUCTION_ROUTES_ENABLED == 'true'
            && 'https://conpaws.com'
            || 'https://conpaws.mrdemonwolf.workers.dev' }}
        run: bun apps/web/scripts/check-headers.ts "$HEALTH_ORIGIN"
