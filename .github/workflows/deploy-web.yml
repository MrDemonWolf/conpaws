name: Deploy web

# Production deploy for conpaws.com.
#
# The apply step is Alchemy (packages/infra/alchemy.run.ts). It provisions the
# D1 database, binds the listmonk and Turnstile secrets, applies migrations, and
# uploads both Workers in one operation.
#
# SAFETY PROPERTIES GIVEN UP WHEN THIS MOVED OFF WRANGLER (2026-08-18):
#   * canary at 0% traffic against a version-override header before promotion
#   * promotion of one exact, previously-probed version id
#   * automatic rollback to the captured stable version on a failed health check
#   * deploying the byte-identical artifact CI smoke-tested, rather than
#     rebuilding the same commit here
# Alchemy applies the whole stack in one step and owns the Worker's versions, so
# these cannot be layered on top without fighting it. Rollback is now manual:
# `wrangler rollback` in apps/web, or re-run this workflow on the last good SHA.
# The post-deploy step below only reports which release is live; it does not
# gate, because it cannot undo the deploy either. A red X that no one can act on
# just trains people to ignore red.
#
# Because of that, keep PRODUCTION_ROUTES_ENABLED false for the first deploy so
# Cloudflare holds a known-good version before conpaws.com points at anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stack
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      ROUTES_ENABLED: ${{ vars.PRODUCTION_ROUTES_ENABLED }}
      WORKERS_DEV_ENABLED: ${{ vars.WORKERS_DEV_ENABLED }}
      PREVIEW_URLS_ENABLED: ${{ vars.PREVIEW_URLS_ENABLED }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject stale release
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::notice title=Stale release skipped::A newer main commit exists."
            exit 1
          fi

      - name: Require deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Build-time and client-side. Without it the env schema falls back to
          # localhost, which makes robots.txt ask crawlers to stay away -- the
          # preview behaviour, served from production.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          LISTMONK_BASE_URL: ${{ vars.LISTMONK_BASE_URL }}
          LISTMONK_API_USER: ${{ vars.LISTMONK_API_USER }}
          LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
          LISTMONK_LIST_ID: ${{ vars.LISTMONK_LIST_ID }}
        run: |
          # Alchemy reads these at deploy time and binds them onto the Workers.
          # A missing one would deploy a broken site, so fail here instead.
          #
          # The ESP is listmonk. Only LISTMONK_API_TOKEN is a secret; the base
          # URL, API user, and list id are repository variables because they are
          # not credentials.
          #
          # They are checked as a GROUP, not as required values. All four unset
          # is the deliberate dormant state: readListmonkConfig returns null,
          # the signup route 503s, and the reconciler no-ops. Requiring them
          # outright broke every production deploy on 2026-08-28 for a waitlist
          # that is not open yet — a deploy gate must not depend on credentials
          # for a feature that ships switched off. A PARTIAL set is the actual
          # danger and still fails: it reads as configured, but any missing
          # value makes readListmonkConfig return null, so the form would accept
          # addresses and mail nobody.
          #
          # NEXT_PUBLIC_TURNSTILE_SITE_KEY is the odd one out: it is a public,
          # build-time client var (packages/env/src/web.ts) that the deploy step
          # inlines into the bundle, not a Worker binding. Without it the widget
          # never renders, the client posts an empty token, and every real signup
          # gets a 400. Hence a variable, not a secret.
          #
          # NEXT_PUBLIC_SITE_URL is required for the same shape of reason. The
          # env schema defaults it to localhost so that an unset value is
          # treated as "not the canonical host", which is what robots.ts wants
          # everywhere except production. On production that default is exactly
          # wrong: it would serve `disallow: /` and ask Google to forget the
          # site. Better to refuse the deploy.
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALCHEMY_STATE_TOKEN ALCHEMY_PASSWORD \
            TURNSTILE_SECRET_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_SITE_URL; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing deploy configuration::${missing[*]}"
            exit 1
          fi

          listmonk_missing=()
          for name in LISTMONK_BASE_URL LISTMONK_API_USER LISTMONK_API_TOKEN LISTMONK_LIST_ID; do
            if [[ -z "${!name}" ]]; then
              listmonk_missing+=("$name")
            fi
          done

          if (( ${#listmonk_missing[@]} == 4 )); then
            echo "::notice title=Waitlist dormant::No listmonk configuration set. The signup route will answer 503 and the reconciler will no-op, by design."
          elif (( ${#listmonk_missing[@]} > 0 )); then
            echo "::error title=Partial listmonk configuration::${listmonk_missing[*]} — a partial set fails closed, so the waitlist would accept addresses and mail nobody. Set all four or none."
            exit 1
          fi

      - name: Deploy stack
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          # Build-time and client-side. Without it the env schema falls back to
          # localhost, which makes robots.txt ask crawlers to stay away -- the
          # preview behaviour, served from production.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          LISTMONK_BASE_URL: ${{ vars.LISTMONK_BASE_URL }}
          LISTMONK_API_USER: ${{ vars.LISTMONK_API_USER }}
          LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
          LISTMONK_LIST_ID: ${{ vars.LISTMONK_LIST_ID }}
        # Runs the Alchemy program directly under Node via tsx, matching every
        # other MrDemonWolf Alchemy project. Not `bun`: Bun segfaults executing
        # an Alchemy program. Not the `alchemy` CLI: the program owns its own
        # phase and shared state store.
        run: bun run deploy

      # This step used to be gated on PRODUCTION_ROUTES_ENABLED, which meant that
      # while routes were off — the entire pre-cutover period — nothing checked a
      # deployed Worker at all. Three deploys that threw
      # `ReferenceError: require is not defined` on the edge passed CI green,
      # because CI's smoke test runs `wrangler dev`, where `node:` resolution is
      # more permissive than production. Always probe something real: the custom
      # domain once it is attached, the workers.dev URL before that.
      #
      # The workers.dev branch is only probe-able because WORKERS_DEV_ENABLED is
      # a repository variable set to true — alchemy.run.ts passes it straight to
      # `url:`, so with the variable unset Alchemy asks Cloudflare not to serve
      # that subdomain and this step would retry twenty times against nothing.
      # The two settings are a pair: at cutover, PRODUCTION_ROUTES_ENABLED goes
      # true and WORKERS_DEV_ENABLED goes false, in that order, never both false.
      # This step REPORTS; it does not gate. It cannot roll back — that was
      # always manual — so failing the run only ever cost time deciding whether
      # a red X meant a broken deploy. It did not, twice, and the second time
      # the noise hid a real outage.
      #
      # What actually made it red: Cloudflare Bot Fight Mode issued a Managed
      # Challenge to the GitHub Actions runner (Azure IPs), curl cannot solve a
      # challenge, so every attempt 403'd for the full seven minutes.
      #
      # Bot Fight Mode is ON again as of 2026-08-28 (verified: the zone's
      # bot_management API reports fight_mode true), so this step may well go
      # yellow. It reports rather than gates, so the deploy is unaffected — but
      # the earlier reason for turning it off still stands, namely that it also
      # challenges Googlebot. Note it CANNOT be fixed with a WAF skip rule:
      # Bot Fight Mode runs outside the Ruleset Engine, so Skip/Bypass/Allow do
      # nothing to it. The only per-source exemption on a Free plan is an IP
      # Access rule, which is how Amazon SNS reaches the listmonk bounce webhook
      # on lists.mrdemonwolf.com.
      - name: Report live release
        continue-on-error: true
        env:
          HEALTH_ORIGIN: >-
            ${{ vars.PRODUCTION_ROUTES_ENABLED == 'true'
            && 'https://conpaws.com'
            || 'https://conpaws.mrdemonwolf.workers.dev' }}
        run: |
          # A short retry, because a fresh deploy takes a few seconds to
          # propagate and a single probe would warn on nearly every run. Thirty
          # seconds, not seven minutes: nothing downstream waits on the answer.
          live=""
          for _ in {1..6}; do
            response="$(curl --silent --show-error --max-time 10 "$HEALTH_ORIGIN/api/health" || true)"
            live="$(jq -r '.release // empty' <<< "$response" 2>/dev/null || true)"
            [[ "$live" == "$RELEASE_SHA" ]] && break
            sleep 5
          done

          if [[ "$live" == "$RELEASE_SHA" ]]; then
            echo "::notice title=Live release::$HEALTH_ORIGIN is serving $RELEASE_SHA"
          else
            echo "::warning title=Live release unconfirmed::$HEALTH_ORIGIN reported '${live:-no response}', expected $RELEASE_SHA. The deploy itself succeeded; check $HEALTH_ORIGIN/api/health and the footer hash."
          fi
