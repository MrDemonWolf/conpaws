name: Deploy web

# Production deploy for conpaws.com.
#
# The apply step is Alchemy (packages/infra/alchemy.run.ts). It provisions the
# D1 database, binds the Brevo and Turnstile secrets, applies migrations, and
# uploads both Workers in one operation.
#
# SAFETY PROPERTIES GIVEN UP WHEN THIS MOVED OFF WRANGLER (2026-08-18):
#   * canary at 0% traffic against a version-override header before promotion
#   * promotion of one exact, previously-probed version id
#   * automatic rollback to the captured stable version on a failed health check
#   * deploying the byte-identical artifact CI smoke-tested, rather than
#     rebuilding the same commit here
# Alchemy applies the whole stack in one step and owns the Worker's versions, so
# these cannot be layered on top without fighting it. Rollback is now manual:
# `wrangler rollback` in apps/web, or re-run this workflow on the last good SHA.
# The post-deploy health check below still fails the run loudly, it just cannot
# undo the deploy for you.
#
# Because of that, keep PRODUCTION_ROUTES_ENABLED false for the first deploy so
# Cloudflare holds a known-good version before conpaws.com points at anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy stack
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      ROUTES_ENABLED: ${{ vars.PRODUCTION_ROUTES_ENABLED }}
      WORKERS_DEV_ENABLED: ${{ vars.WORKERS_DEV_ENABLED }}
      PREVIEW_URLS_ENABLED: ${{ vars.PREVIEW_URLS_ENABLED }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject stale release
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::notice title=Stale release skipped::A newer main commit exists."
            exit 1
          fi

      - name: Require deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          # Alchemy reads these at deploy time and binds them onto the Workers.
          # A missing one would deploy a broken site, so fail here instead.
          #
          # No ESP credential is listed. The waitlist form is closed and no
          # sender is bound, so the signup route is meant to 503 — see the ESP
          # note in packages/infra/alchemy.run.ts. Add the Listmonk variables
          # here when the swap lands, or the deploy will happily ship a waitlist
          # that accepts addresses and mails nobody.
          #
          # NEXT_PUBLIC_TURNSTILE_SITE_KEY is the odd one out: it is a public,
          # build-time client var (packages/env/src/web.ts) that the deploy step
          # inlines into the bundle, not a Worker binding. Without it the widget
          # never renders, the client posts an empty token, and every real signup
          # gets a 400. Hence a variable, not a secret.
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ALCHEMY_STATE_TOKEN ALCHEMY_PASSWORD \
            TURNSTILE_SECRET_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Missing deploy configuration::${missing[*]}"
            exit 1
          fi

      - name: Deploy stack
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        # Runs the Alchemy program directly under Node via tsx, matching every
        # other MrDemonWolf Alchemy project. Not `bun`: Bun segfaults executing
        # an Alchemy program. Not the `alchemy` CLI: the program owns its own
        # phase and shared state store.
        run: bun run deploy

      # This step used to be gated on PRODUCTION_ROUTES_ENABLED, which meant that
      # while routes were off — the entire pre-cutover period — nothing checked a
      # deployed Worker at all. Three deploys that threw
      # `ReferenceError: require is not defined` on the edge passed CI green,
      # because CI's smoke test runs `wrangler dev`, where `node:` resolution is
      # more permissive than production. Always probe something real: the custom
      # domain once it is attached, the workers.dev URL before that.
      #
      # The workers.dev branch is only probe-able because WORKERS_DEV_ENABLED is
      # a repository variable set to true — alchemy.run.ts passes it straight to
      # `url:`, so with the variable unset Alchemy asks Cloudflare not to serve
      # that subdomain and this step would retry twenty times against nothing.
      # The two settings are a pair: at cutover, PRODUCTION_ROUTES_ENABLED goes
      # true and WORKERS_DEV_ENABLED goes false, in that order, never both false.
      - name: Verify deploy
        env:
          HEALTH_ORIGIN: >-
            ${{ vars.PRODUCTION_ROUTES_ENABLED == 'true'
            && 'https://conpaws.com'
            || 'https://conpaws.mrdemonwolf.workers.dev' }}
        run: |
          # 40 x 10s ~= 7 minutes. The old 20 x 3s gave up after about a
          # minute, which was enough for a redeploy onto a live domain and not
          # nearly enough the first time conpaws.com was attached: the custom
          # domain was still activating, the health check failed, and the run
          # went red over a deploy that was completely fine. A verification step
          # that cries wolf is worse than none, because the next real failure
          # gets waved through.
          deploy_ok=false
          for _ in {1..40}; do
            response="$(curl --fail --silent --show-error --max-time 10 "$HEALTH_ORIGIN/api/health" || true)"
            if jq -e --arg sha "$RELEASE_SHA" '.ok == true and .release == $sha' \
              <<< "$response" >/dev/null 2>&1; then
              deploy_ok=true
              break
            fi
            sleep 10
          done

          if [[ "$deploy_ok" != "true" ]]; then
            echo "::error title=Deploy health failed::$HEALTH_ORIGIN is not serving $RELEASE_SHA. Roll back manually: cd apps/web && bunx wrangler rollback"
            exit 1
          fi
