name: Native release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build (must have passing CI)
        type: choice
        options: [dev, main]
        default: dev

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

# Both branches upload to the same store records. Never overlap their releases.
concurrency:
  group: native-store-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      vars.NATIVE_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
      variant: ${{ steps.source.outputs.variant }}
      number: ${{ steps.number.outputs.number }}
    steps:
      - name: Select an exact commit with passing CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$GH_RUN_ATTEMPT" != "1" ]]; then
            echo "::error::Use Actions > Native release > Run workflow for a fresh build number. Do not re-run an old upload."
            exit 1
          fi
          # GitHub concurrency serializes execution but does not promise FIFO.
          newer=$(gh api --paginate "repos/$REPOSITORY/actions/workflows/release-native.yml/runs?status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number > $RELEASE_RUN_NUMBER) | .run_number")
          if [[ -n "$newer" ]]; then
            echo "::error::A newer release run has already finished. Start a fresh workflow to reserve a higher build number."
            exit 1
          fi
          case "$SOURCE_BRANCH" in
            dev) variant=preview ;;
            main) variant=production ;;
            *) exit 1 ;;
          esac
          head=$(gh api "repos/$REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq .object.sha)
          sha=${SOURCE_SHA:-$head}
          if [[ "$sha" != "$head" ]]; then
            echo "::error::A newer commit exists. Wait for its CI or start a new workflow."
            exit 1
          fi
          passed=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch "$SOURCE_BRANCH" \
            --event push --commit "$sha" --json conclusion --jq 'any(.[]; .conclusion == "success")')
          if [[ "$passed" != "true" ]]; then
            echo "::error::This commit has no successful push CI run."
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "branch=$SOURCE_BRANCH"
            echo "variant=$variant"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Assign the shared build number
        id: number
        run: |
          number=$(node apps/native/scripts/build-number.mjs --ci)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          {
            echo "## ConPaws build $number"
            echo "Branch: $RELEASE_BRANCH · Variant: $APP_VARIANT"
            echo "Commit: $RELEASE_SHA"
            echo "Public store rollout remains manual."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_BRANCH: ${{ steps.source.outputs.branch }}
          APP_VARIANT: ${{ steps.source.outputs.variant }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27
          - platform: android
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CI: "1"
      APP_VARIANT: ${{ needs.prepare.outputs.variant }}
      RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      CONPAWS_ALLOW_PREVIEW: ${{ needs.prepare.outputs.branch == 'dev' && '1' || '0' }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      BUNDLE_GEMFILE: ${{ github.workspace }}/apps/native/Gemfile
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Check release credentials
        env:
          PLATFORM: ${{ matrix.platform }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          IOS_SIGNING_ZIP_BASE64: ${{ secrets.IOS_SIGNING_ZIP_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          required=(SENTRY_AUTH_TOKEN EXPO_PUBLIC_SENTRY_DSN)
          if [[ "$PLATFORM" == "ios" ]]; then
            required+=(IOS_SIGNING_ZIP_BASE64 IOS_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64)
          else
            required+=(ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)
          fi
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release configuration: ${missing[*]}. See https://app.notion.com/p/408d61481c7b8197a680fcb3c271e969"
            exit 1
          fi

          bun --eval '
            import { isValidPublicSentryDsn } from "./apps/native/src/lib/sentry-config.ts";

            const validDsns = [
              "https://public@example.invalid/1",
              "https://public_123@example.invalid:8443/sentry/42",
            ];
            const invalidDsns = [
              "https://public:private@example.invalid/1",
              "https://public@example.invalid:private/1",
              "https://public@ example.invalid/1",
              "https://public@example.invalid:99999/1",
              "https://public%3Aprivate@example.invalid/1",
              "https://public@example.invalid/1/",
              "https://public@example.invalid/1?environment=production",
            ];

            if (
              validDsns.some((dsn) => !isValidPublicSentryDsn(dsn)) ||
              invalidDsns.some(isValidPublicSentryDsn)
            ) {
              console.error("::error::The release DSN guard failed its parser assertions.");
              process.exit(1);
            }

            if (!isValidPublicSentryDsn(process.env.EXPO_PUBLIC_SENTRY_DSN ?? "")) {
              console.error("::error::EXPO_PUBLIC_SENTRY_DSN must be a parser-compatible public HTTPS DSN without a password, query, or fragment and with a numeric project ID.");
              process.exit(1);
            }
          '

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/native

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        if: matrix.platform == 'ios'
        run: |
          xcode_path=/Applications/Xcode_27.1.app/Contents/Developer
          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode 27.1 is missing from the xcode-27 runner image. Check the GitHub runner image inventory."
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check release lane guards
        working-directory: apps/native
        run: bundle exec ruby fastlane/check.rb

      - name: Generate native projects with this build number
        working-directory: apps/native
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.number }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/build-number.mjs --set "$BUILD_NUMBER"
          npx --no-install expo prebuild --platform "$PLATFORM"
          node scripts/build-number.mjs --check
          npx --no-install expo config --type public --json > "$RUNNER_TEMP/release-config.json"
          version=$(jq -r .version "$RUNNER_TEMP/release-config.json")
          printf 'Version: %s · Build: %s · Platform: %s\n' "$version" "$BUILD_NUMBER" "$PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p build/store
          printf 'version=%s\nbuild=%s\nbranch=%s\nvariant=%s\ncommit=%s\n' \
            "$version" "$BUILD_NUMBER" "$RELEASE_BRANCH" "$APP_VARIANT" "$RELEASE_SHA" > build/store/release.txt

      - name: Build and upload iOS to App Store Connect
        if: matrix.platform == 'ios'
        working-directory: apps/native
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          IOS_SIGNING_ZIP_BASE64: ${{ secrets.IOS_SIGNING_ZIP_BASE64 }}
          IOS_SIGNING_DIRECTORY: ${{ runner.temp }}/conpaws-signing
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p "$IOS_SIGNING_DIRECTORY"
          printf '%s' "$IOS_SIGNING_ZIP_BASE64" | base64 -D > "$RUNNER_TEMP/signing.zip"
          unzip -q -j "$RUNNER_TEMP/signing.zip" -d "$IOS_SIGNING_DIRECTORY"
          bundle exec fastlane ios release

      - name: Build and upload Android to Google Play
        if: matrix.platform == 'android'
        working-directory: apps/native
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/conpaws-upload.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_KEY_PATH: ${{ runner.temp }}/google-play.json
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$GOOGLE_PLAY_KEY_PATH"
          bundle exec fastlane android release

      - name: Save signed artifacts and release record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conpaws-${{ needs.prepare.outputs.branch }}-${{ needs.prepare.outputs.number }}-${{ matrix.platform }}
          path: apps/native/build/store/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary credentials
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          rm -rf "$RUNNER_TEMP/conpaws-signing"
          rm -f "$RUNNER_TEMP/signing.zip" "$RUNNER_TEMP/conpaws-upload.jks" "$RUNNER_TEMP/google-play.json"
          if [[ "$PLATFORM" == "ios" ]]; then
            security delete-keychain fastlane_tmp_keychain || true
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          fi
