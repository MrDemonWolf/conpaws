plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.conpawswidgets'
version = '0.1.0'

android {
  namespace "expo.modules.conpawswidgets"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation project(':expo-widgets')
}

// Pure model/parser checks run on the JVM without Android or test libraries.
// CI calls widgetModelCheck; it also runs the tracked-event checks.
afterEvaluate {
  def checkClasspath = files("${buildDir}/tmp/kotlin-classes/debug", "${buildDir}/tmp/kotlin-classes/debugUnitTest") + configurations.debugUnitTestRuntimeClasspath.incoming.artifactView {
    attributes.attribute(org.gradle.api.attributes.Attribute.of("artifactType", String), "jar")
  }.files
  def trackedEventCheck = tasks.register('trackedEventModelCheck', JavaExec) {
    dependsOn 'compileDebugUnitTestKotlin'
    classpath = checkClasspath
    mainClass = 'expo.modules.conpawswidgets.ConPawsTrackedEventChecks'
  }
  tasks.register('widgetModelCheck', JavaExec) {
    dependsOn 'compileDebugUnitTestKotlin', trackedEventCheck
    classpath = checkClasspath
    mainClass = 'expo.modules.conpawswidgets.ConPawsWidgetModelChecks'
  }
}
