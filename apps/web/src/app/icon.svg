<svg xmlns="http://www.w3.org/2000/svg" viewBox="35 34 130 130">
  <!--
    ConPaws mark. Traced with potrace from the 2400px brand art at
    apps/native/assets/images/ConPaws.icon/Assets/logo.png, then scaled to a
    200-unit box and optimised. It is the real logo, not an approximation —
    the hand-drawn version this replaces had the wrong paw pad and the wrong
    spike proportions.

    Next's App Router picks this up as the favicon from its filename alone, so
    there is nothing to register in layout.tsx.

    An SVG favicon is the only kind that can answer prefers-color-scheme, which
    is why the mark lives here and not only in favicon.ico: browser chrome is
    the one surface the site does not get to pick the background of. The light
    value is darkened from the brand blue so it holds up against a white tab
    strip; dark uses the brand primary unchanged.

    The colour is set BOTH as a presentation attribute and in CSS, deliberately.
    CSS wins where it is supported, which is where the media query matters;
    rasterisers that ignore stylesheets — librsvg, which generates favicon.ico
    from this same file — still get brand colour instead of defaulting to black.

    Regenerate with: potrace + svgo, see the logo note in compass-paw.tsx.
  -->
  <style>
    .f { fill: #0b86c4 }
    @media (prefers-color-scheme: dark) { .f { fill: #0faced } }
  </style>
