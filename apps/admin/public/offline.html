<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091533" />
    <title>You’re offline · ConPaws Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #091533;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #dce3ec; border-radius: 24px; background: white; box-shadow: 0 16px 48px rgb(9 21 51 / 8%); }
      img { display: block; width: 52px; height: 52px; margin-bottom: 24px; border-radius: 14px; }
      p { color: #475569; line-height: 1.6; }
      button { min-height: 48px; margin-top: 12px; padding: 0 20px; border: 0; border-radius: 12px; background: #0faced; color: #091533; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
      @media (max-width: 480px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" width="52" height="52" />
      <p>ConPaws Admin</p>
      <h1>You’re offline</h1>
      <p>
        Reconnect to open your convention workspace. Private schedules aren’t
        cached offline, and edits must be saved while you’re connected.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
